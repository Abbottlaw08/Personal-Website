<!DOCTYPE html>
<html>
<head>
    <title>Test Save/Load Fun Money & Forecast</title>
</head>
<body>
    <h1>Test Save/Load for Fun Money & Forecast Inputs</h1>
    <div id="test-results"></div>
    
    <script>
    function testSaveLoadFunctionality() {
        // Test data
        const testData = {
            funMoneyPercentage: '15.5',
            annualReturn: '8.2',
            inflationRate: '3.5',
            currentSavings: '25000',
            forecastView: 'real'
        };
        
        // Simulate saving data to localStorage
        const mockInputData = {
            // Existing data...
            salary1: '75000',
            // Fun money allocation
            funMoneyPercentage: testData.funMoneyPercentage,
            // Forecast inputs  
            annualReturn: testData.annualReturn,
            inflationRate: testData.inflationRate,
            currentSavings: testData.currentSavings,
            forecastView: testData.forecastView,
            // UI state
            chartPeriod: 'monthly',
            detailChartPeriod: 'monthly'
        };
        
        // Simulate the save
        localStorage.setItem('budgetTrackerInputs', JSON.stringify(mockInputData));
        
        // Test loading
        const savedData = localStorage.getItem('budgetTrackerInputs');
        const parsedData = JSON.parse(savedData);
        
        // Verify the data
        const results = document.getElementById('test-results');
        const isCorrect = 
            parsedData.funMoneyPercentage === testData.funMoneyPercentage &&
            parsedData.annualReturn === testData.annualReturn &&
            parsedData.inflationRate === testData.inflationRate &&
            parsedData.currentSavings === testData.currentSavings &&
            parsedData.forecastView === testData.forecastView;
        
        results.innerHTML = `
            <h2>Save/Load Test Results</h2>
            <h3>Test Data:</h3>
            <p><strong>Fun Money Percentage:</strong> ${testData.funMoneyPercentage}%</p>
            <p><strong>Annual Return:</strong> ${testData.annualReturn}%</p>
            <p><strong>Inflation Rate:</strong> ${testData.inflationRate}%</p>
            <p><strong>Current Savings:</strong> $${testData.currentSavings}</p>
            <p><strong>Forecast View:</strong> ${testData.forecastView}</p>
            
            <h3>Saved Data:</h3>
            <p><strong>Fun Money Percentage:</strong> ${parsedData.funMoneyPercentage}%</p>
            <p><strong>Annual Return:</strong> ${parsedData.annualReturn}%</p>
            <p><strong>Inflation Rate:</strong> ${parsedData.inflationRate}%</p>
            <p><strong>Current Savings:</strong> $${parsedData.currentSavings}</p>
            <p><strong>Forecast View:</strong> ${parsedData.forecastView}</p>
            
            <h3>Result:</h3>
            <p style="color: ${isCorrect ? 'green' : 'red'}; font-weight: bold; font-size: 18px;">
                ${isCorrect ? '✅ PASS - All inputs saved correctly!' : '❌ FAIL - Data mismatch!'}
            </p>
            
            <h3>Implementation Check:</h3>
            <p>• Fun Money input saving: ${parsedData.funMoneyPercentage ? '✅' : '❌'}</p>
            <p>• Forecast inputs saving: ${parsedData.annualReturn && parsedData.inflationRate && parsedData.currentSavings ? '✅' : '❌'}</p>
            <p>• Forecast view saving: ${parsedData.forecastView ? '✅' : '❌'}</p>
        `;
        
        // Clean up test data
        localStorage.removeItem('budgetTrackerInputs');
    }
    
    testSaveLoadFunctionality();
    </script>
</body>
</html>
