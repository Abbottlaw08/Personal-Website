<!DOCTYPE html>
<html>
<head>
    <title>Debug Fun Money Logic</title>
</head>
<body>
    <h1>Debug Fun Money Logic</h1>
    <div id="debug"></div>
    
    <script>
    // Simulate the corrected logic
    function debugFunMoneyLogic() {
        const netIncomeAnnual = 100000; // Example
        const funMoneyPercentage = 0; // 0% fun money
        const funMoneyAllocationAnnual = (netIncomeAnnual * funMoneyPercentage) / 100; // Should be $0
        
        const bills = [
            { name: 'Rent', amount: 1500, category: 'need' },
            { name: 'Groceries', amount: 400, category: 'need' },
            { name: 'Netflix', amount: 15, category: 'want' },
            { name: 'Gym', amount: 50, category: 'want' }
        ];
        
        const wantsBills = bills.filter(bill => bill.category === 'want');
        const needsBills = bills.filter(bill => bill.category === 'need');
        const wantsBillsTotal = wantsBills.reduce((sum, bill) => sum + bill.amount, 0);
        const needsBillsTotal = needsBills.reduce((sum, bill) => sum + bill.amount, 0);
        
        const wantsBillsAnnual = wantsBillsTotal * 12;
        const needsBillsAnnual = needsBillsTotal * 12;
        
        // Chart values (what should be displayed)
        const chartNeedsBills = needsBillsAnnual; // Only needs bills in chart
        const chartFunMoney = funMoneyAllocationAnnual; // Total allocation (should be $0)
        const chartRemaining = Math.max(0, netIncomeAnnual - needsBillsAnnual - funMoneyAllocationAnnual);
        
        // Verification
        const totalAllocated = chartNeedsBills + chartFunMoney + chartRemaining;
        
        const debug = document.getElementById('debug');
        debug.innerHTML = `
            <h2>Scenario: 0% Fun Money</h2>
            <p><strong>Net Income:</strong> $${netIncomeAnnual.toLocaleString()}</p>
            <p><strong>Fun Money Percentage:</strong> ${funMoneyPercentage}%</p>
            <p><strong>Wants Bills Monthly:</strong> $${wantsBillsTotal}</p>
            <p><strong>Needs Bills Monthly:</strong> $${needsBillsTotal}</p>
            <hr>
            <h3>Chart Display Values:</h3>
            <p><strong>Bills (Needs Only):</strong> $${chartNeedsBills.toLocaleString()}</p>
            <p><strong>Fun Money:</strong> $${chartFunMoney.toLocaleString()}</p>
            <p><strong>Remaining:</strong> $${chartRemaining.toLocaleString()}</p>
            <hr>
            <h3>Verification:</h3>
            <p>Total Allocated: $${totalAllocated.toLocaleString()}</p>
            <p>Net Income: $${netIncomeAnnual.toLocaleString()}</p>
            <p><strong>Balance:</strong> ${totalAllocated === netIncomeAnnual ? '✅ CORRECT' : '❌ ERROR'}</p>
            <hr>
            <h3>Expected Result:</h3>
            <p>• Fun Money should be $0 (0% of income)</p>
            <p>• Remaining should be $${(netIncomeAnnual - needsBillsAnnual).toLocaleString()}</p>
            <p>• Bills should only show needs ($${chartNeedsBills.toLocaleString()})</p>
            <p>• Wants bills ($${wantsBillsAnnual.toLocaleString()}) should appear in fun money breakdown as "unfunded"</p>
        `;
    }
    
    debugFunMoneyLogic();
    </script>
</body>
</html>
